name: Finalize previous day

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finalize yesterday at 09:00 KST
        run: pnpm finalize:yesterday
        env:
          COLLECTOR_GAS_WEB_APP_URL: ${{ secrets.COLLECTOR_GAS_WEB_APP_URL }}
          COLLECTOR_SHARED_SECRET: ${{ secrets.COLLECTOR_SHARED_SECRET }}
      - name: Publish finalized JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          git diff --cached --quiet || git commit -m "Update finalized ranking data"
          git push
