name: Hourly ranking collection

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Collect hourly rankings
        run: pnpm collect:hourly
        env:
          COLLECTOR_GAS_WEB_APP_URL: ${{ secrets.COLLECTOR_GAS_WEB_APP_URL }}
          COLLECTOR_SHARED_SECRET: ${{ secrets.COLLECTOR_SHARED_SECRET }}
      - name: Store screenshots for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
